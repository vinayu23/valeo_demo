apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-dotnet-api
  namespace: default
  labels:
    app.kubernetes.io/name: sample-dotnet-api
    app.kubernetes.io/part-of: edgepc-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-dotnet-api
  template:
    metadata:
      labels:
        app: sample-dotnet-api
    spec:
      containers:
        - name: sample-dotnet-api
          image: sample-dotnet-api-image:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
