apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-dotnet-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # UPDATE THIS with your actual GitHub Repository URL
    repoURL: 'https://github.com/YOUR_GITHUB_USERNAME/EdgePC_Deployment.git'
    targetRevision: HEAD
    path: k8s
  destination:
    # Target GKE cluster (https://kubernetes.default.svc for cluster where Argo CD is installed)
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
